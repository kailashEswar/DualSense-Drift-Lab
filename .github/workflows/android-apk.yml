name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK Platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run tests and create APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Name installable APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DualSense-Drift-Calibration.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DualSense-Drift-Calibration-APK
          path: app/build/outputs/apk/debug/DualSense-Drift-Calibration.apk
          if-no-files-found: error
